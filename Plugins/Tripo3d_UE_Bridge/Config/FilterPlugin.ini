[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; Tripo3DUEBridge.Build.cs hard-requires the prebuilt IXWebSocket static library and
; its public headers. UAT BuildPlugin does not copy ThirdParty/ by default, so the
; packaged plugin must declare them here, otherwise any project that regenerates and
; recompiles the plugin fails with "IXWebSocket.lib not found".
/ThirdParty/IXWebSocket/Lib/Win64/IXWebSocket.lib
/ThirdParty/IXWebSocket/ixwebsocket/...
